name: Build

# Construit, teste, et produit des paquets installables sans compilation :
#
#   Windows  installateur .exe  +  archive portable
#   Linux    .deb  +  .AppImage  +  archive portable
#
# Sur un tag `v*`, tout est publie dans une Release.
#
# Aucune etape de ce workflow ne touche a un firmware : les machines de CI
# n'exposent pas de variables UEFI, et la suite de tests s'execute
# integralement contre le firmware simule.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Le bundler Tauri doit embarquer le helper a cote de l'executable :
  # l'application le cherche la, et nulle part ailleurs.
  TAURI_BUNDLE_CONFIG: tauri.bundle.json

jobs:
  # ---------------------------------------------------------------------
  # Verifications independantes de la plateforme
  # ---------------------------------------------------------------------
  controles:
    name: Tests et controles de securite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cle explicite : `runner.os` vaut "Linux" pour toutes les versions
      # d Ubuntu, si bien qu un cache construit sur une image plus recente
      # peut etre restaure ici et livrer des artefacts lies a des
      # bibliotheques systeme incompatibles.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-controles

      - name: Suite de tests complete
        run: cargo test --workspace --features bootsel-platform/mock

      # `testdata` expose le firmware simule aux tests d'integration. Sans
      # elle, ces deux suites ne compilent pas : le backend mock est derriere
      # cette fonctionnalite pour ne jamais entrer dans un binaire de release.
      - name: Controles de securite nommes
        run: |
          cargo test -p bootsel-core --features testdata --test security
          cargo test -p bootsel-core --features testdata --test no_destructive_code

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------
  # Windows : installateur + archive portable
  # ---------------------------------------------------------------------
  windows:
    name: Paquets Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-latest-paquets

      - name: Tests
        run: cargo test --workspace --features bootsel-platform/mock

      - name: Compilation
        run: cargo build --release --workspace --features bootsel-platform/mock

      # Le bundler attend des noms suffixes par la cible ; il retire le
      # suffixe a l'installation, ce qui place le helper juste a cote de
      # l'executable, la ou l'application le cherche.
      - name: Preparation des binaires embarques
        shell: bash
        run: |
          mkdir -p crates/bootsel-ui/binaries
          cp target/release/bootsel-helper.exe \
             crates/bootsel-ui/binaries/bootsel-helper-x86_64-pc-windows-msvc.exe
          cp target/release/bootsel-cli.exe \
             crates/bootsel-ui/binaries/bootsel-cli-x86_64-pc-windows-msvc.exe

      - name: Installation du bundler Tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Construction de l'installateur
        working-directory: crates/bootsel-ui
        run: cargo tauri build --bundles nsis --config tauri.bundle.json

      # Verification que le helper est reellement embarque : sans lui a cote
      # de l'executable, l'application ne peut pas lire le firmware.
      - name: Verification de l'installateur
        shell: bash
        run: |
          INSTALLER=$(find target/release/bundle -name '*-setup.exe' | head -1)
          echo "installateur : $INSTALLER"
          CONTENU=$(7z l "$INSTALLER")
          echo "$CONTENU" | grep -iE 'bootsel' || true
          for attendu in bootsel.exe bootsel-helper.exe bootsel-cli.exe; do
            echo "$CONTENU" | grep -qi "$attendu"               || { echo "MANQUANT dans l'installateur : $attendu"; exit 1; }
          done
          echo "les trois binaires sont bien embarques"

      - name: Assemblage
        shell: bash
        run: |
          mkdir -p sortie/portable/UniversalBootSelector-Windows sortie/installateur

          cp target/release/bootsel.exe \
             target/release/bootsel-helper.exe \
             target/release/bootsel-cli.exe \
             docs/LISEZ-MOI-windows.txt \
             sortie/portable/UniversalBootSelector-Windows/
          mv sortie/portable/UniversalBootSelector-Windows/LISEZ-MOI-windows.txt \
             sortie/portable/UniversalBootSelector-Windows/LISEZ-MOI.txt

          find target/release/bundle -name '*.exe' -exec cp {} sortie/installateur/ \;
          ls -la sortie/installateur/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: sortie/portable/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installateur
          path: sortie/installateur/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Linux : .deb, .AppImage, et archive portable
  # ---------------------------------------------------------------------
  linux:
    name: Paquets Linux
    # Volontairement ancien : un binaire compile sur une glibc ancienne
    # fonctionne sur les distributions plus recentes, l'inverse est faux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libfuse2 file desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-paquets

      - name: Tests
        run: cargo test --workspace --features bootsel-platform/mock

      - name: Compilation
        run: cargo build --release --workspace --features bootsel-platform/mock

      - name: Preparation des binaires embarques
        run: |
          mkdir -p crates/bootsel-ui/binaries
          cp target/release/bootsel-helper \
             crates/bootsel-ui/binaries/bootsel-helper-x86_64-unknown-linux-gnu
          cp target/release/bootsel-cli \
             crates/bootsel-ui/binaries/bootsel-cli-x86_64-unknown-linux-gnu

      - name: Installation du bundler Tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Construction du .deb et de l'AppImage
        working-directory: crates/bootsel-ui
        run: cargo tauri build --bundles deb,appimage --config tauri.bundle.json

      - name: Assemblage
        run: |
          mkdir -p sortie/paquets sortie/portable/UniversalBootSelector-Linux

          cp target/release/bootsel \
             target/release/bootsel-helper \
             target/release/bootsel-cli \
             sortie/portable/UniversalBootSelector-Linux/
          cp docs/LISEZ-MOI-linux.txt \
             sortie/portable/UniversalBootSelector-Linux/LISEZ-MOI.txt

          # Les noms produits par le bundler contiennent des espaces et le
          # numero de version ; on les normalise pour qu'ils soient simples
          # a telecharger et a taper.
          find target/release/bundle -name '*.deb' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "sortie/paquets/universal-boot-selector_amd64.deb"
          done
          find target/release/bundle -name '*.AppImage' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "sortie/paquets/UniversalBootSelector-x86_64.AppImage"
          done
          chmod +x sortie/paquets/*.AppImage 2>/dev/null || true
          ls -la sortie/paquets/

      - name: Verification du .deb
        run: |
          echo "--- dependances declarees ---"
          dpkg-deb -f sortie/paquets/universal-boot-selector_amd64.deb Depends
          echo "--- contenu ---"
          dpkg-deb -c sortie/paquets/universal-boot-selector_amd64.deb | grep -E 'bootsel' || true
          # Sans le helper a cote de l'executable, l'application ne peut pas
          # ecrire BootNext. On refuse de publier un paquet incomplet.
          for attendu in bootsel bootsel-helper bootsel-cli; do
            dpkg-deb -c sortie/paquets/universal-boot-selector_amd64.deb               | grep -qE "/$attendu\$"               || { echo "MANQUANT dans le .deb : $attendu"; exit 1; }
          done
          echo "les trois binaires sont bien dans le .deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-paquets
          path: sortie/paquets/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: sortie/portable/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Publication, uniquement sur un tag
  # ---------------------------------------------------------------------
  publication:
    name: Release
    needs: [controles, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: telechargements

      - name: Archives et fichiers a publier
        run: |
          mkdir -p publication

          # Paquets Linux, deja prets a l'emploi.
          cp telechargements/linux-paquets/* publication/

          # Installateur Windows.
          cp telechargements/windows-installateur/* publication/

          # Archives portables, pour qui prefere ne rien installer.
          (cd telechargements/windows-portable && zip -r ../../publication/UniversalBootSelector-Windows-portable.zip .)
          (cd telechargements/linux-portable && chmod +x UniversalBootSelector-Linux/* && zip -r ../../publication/UniversalBootSelector-Linux-portable.zip .)

          ls -la publication/

      - uses: softprops/action-gh-release@v2
        with:
          files: publication/*
          generate_release_notes: true
          body: |
            ## Telechargements

            | Vous etes sur | Prenez | Puis |
            |---|---|---|
            | **Windows** | l'installateur `.exe` | double-clic, suivez l'assistant |
            | **Windows**, sans installer | `...-Windows-portable.zip` | dezippez, lancez `bootsel.exe` |
            | **Debian / Ubuntu** | `universal-boot-selector_amd64.deb` | `sudo apt install ./universal-boot-selector_amd64.deb` |
            | **Autre Linux** | `...-x86_64.AppImage` | `chmod +x` puis lancez-le |

            Le `.deb` installe ses dependances tout seul.
            L'AppImage n'a besoin de rien : tout est dedans.

            ## Avant de vous en servir

            Commencez par `bootsel-cli` : il est en **lecture seule** et ne
            contient aucun code d'ecriture. Il vous montre ce que
            l'application detecte, sans rien modifier.

            L'application n'ecrit qu'une seule chose : la variable UEFI
            `BootNext`, longue de deux octets, et uniquement quand vous
            confirmez. L'ordre de demarrage permanent n'est jamais touche.
