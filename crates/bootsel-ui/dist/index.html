<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Boot Selector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Jeu d'icones. Formes geometriques sobres, jamais d'emoji. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-windows" viewBox="0 0 16 16">
      <path fill="currentColor" d="M1.5 3.2 7 2.4v5.1H1.5zM8 2.3l6.5-.9v6.1H8zM1.5 8.5H7v5.1l-5.5-.8zM8 8.5h6.5v6.1L8 13.7z"/>
    </symbol>
    <symbol id="i-linux" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.3" d="M8 1.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 8 1.8Z"/>
      <circle cx="6" cy="6.4" r="1" fill="currentColor"/>
      <circle cx="10" cy="6.4" r="1" fill="currentColor"/>
      <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" d="M5.6 10.2c1.4 1.3 3.4 1.3 4.8 0"/>
    </symbol>
    <symbol id="i-usb" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"
            d="M8 14V4.4M8 4.4 6.2 6.6M8 4.4l1.8 2.2M5 9.4v1.2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V9.4"/>
      <circle cx="8" cy="2.6" r="1.3" fill="currentColor"/>
    </symbol>
    <symbol id="i-firmware" viewBox="0 0 16 16">
      <rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1"
            fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
            d="M6.4 4.2V2.4M9.6 4.2V2.4M6.4 13.6v-1.8M9.6 13.6v-1.8M4.2 6.4H2.4M4.2 9.6H2.4M13.6 6.4h-1.8M13.6 9.6h-1.8"/>
    </symbol>
    <symbol id="i-disk" viewBox="0 0 16 16">
      <ellipse cx="8" cy="4.2" rx="5.4" ry="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path fill="none" stroke="currentColor" stroke-width="1.3" d="M2.6 4.2v7.6c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2V4.2"/>
    </symbol>
    <symbol id="i-warn" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"
            d="M8 2.4 14.4 13.4H1.6Z"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M8 6.6v3"/>
      <circle cx="8" cy="11.6" r=".85" fill="currentColor"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 16 16">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            d="M3.5 8h9M8.8 4.2 12.6 8l-3.8 3.8"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 16 16">
      <rect x="3.4" y="7" width="9.2" height="6.6" rx="1.2"
            fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path fill="none" stroke="currentColor" stroke-width="1.3" d="M5.6 7V5.2a2.4 2.4 0 0 1 4.8 0V7"/>
    </symbol>
  </defs>
</svg>

<header class="bar">
  <h1>Universal Boot Selector</h1>
  <div class="bar-meta" id="firmware-meta"></div>
</header>

<main class="layout">
  <section class="panel panel-list" aria-label="Systèmes détectés">
    <div id="list" class="list" role="listbox" aria-label="Systèmes de démarrage"></div>
  </section>

  <aside class="panel panel-detail" id="detail" aria-live="polite"></aside>
</main>

<footer class="bar bar-foot">
  <span id="status" class="status"></span>
  <span id="backend" class="backend"></span>
</footer>

<!-- Dialogue de confirmation. Enonce exactement ce qui sera fait. -->
<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title">Redémarrer</h2>
    <div id="dlg-body"></div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="dlg-cancel">Annuler</button>
      <button type="button" class="btn btn-primary" id="dlg-confirm">Redémarrer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
